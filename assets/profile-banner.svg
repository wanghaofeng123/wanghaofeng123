    <circle cx="988" cy="146" r="13" fill="#102b3b" stroke="#72b5ff" stroke-width="5"/>
    <circle cx="1060" cy="177" r="11" fill="#102b3b" stroke="#5eead4" stroke-width="4"/>
    <rect x="1116" y="205" width="38" height="38" rx="5" stroke="#5eead4" stroke-opacity=".75" stroke-width="2"/>
    <path d="M1082 224H1099M1135 170V188" stroke="#5eead4" stroke-opacity=".4" stroke-width="2" stroke-dasharray="3 5"/>
