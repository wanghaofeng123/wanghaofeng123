<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Wang Haofeng — Embodied AI and Agents</title>
  <desc id="desc">A dark blue banner with an abstract robot arm and the themes embodied models, VLA, WAM, and agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c32"/>
      <stop offset="1" stop-color="#0b2936"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a0b8cf" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#background)"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>
  <circle cx="1120" cy="80" r="170" fill="#22d3ee" fill-opacity=".035"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="56" y="49" width="5" height="21" rx="2.5" fill="#5eead4"/>
    <text x="75" y="65" font-size="16" font-weight="600" letter-spacing="3" fill="#9db5cf">RESEARCH &amp; ENGINEERING</text>
    <text x="56" y="139" font-size="53" font-weight="700" letter-spacing="1" fill="#f1f5f9">WANG HAOFENG</text>
    <text x="59" y="185" font-size="27" font-weight="400" fill="#c9d8e8">Embodied AI &amp; Agents</text>
    <g font-size="16" fill="#d8e7f3">
