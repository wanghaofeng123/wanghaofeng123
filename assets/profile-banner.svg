      <text x="146" y="247" text-anchor="middle">Embodied Models</text>
      <rect x="247" y="225" width="71" height="34" rx="17" fill="#58a6ff" fill-opacity=".09" stroke="#58a6ff" stroke-opacity=".25"/>
      <text x="282.5" y="247" text-anchor="middle">VLA</text>
      <rect x="330" y="225" width="80" height="34" rx="17" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".25"/>
      <text x="370" y="247" text-anchor="middle">WAM</text>
      <rect x="422" y="225" width="92" height="34" rx="17" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".25"/>
      <text x="468" y="247" text-anchor="middle">Agent</text>
    </g>
  </g>
